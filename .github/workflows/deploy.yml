name: GitHub Pages に公開

# 既定のブランチに push されたとき、または手動で実行したときに、サイトをビルドして公開する。
# 事前に、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: ビルド
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        # 公開先の URL(独自ドメインの有無を含む)は GitHub の設定から自動で受け取る
        run: npx astro build --site "$ORIGIN" ${BASE:+--base "$BASE"}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
